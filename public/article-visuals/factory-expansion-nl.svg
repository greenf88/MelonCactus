<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bewijsladder voor een fabrieksuitbreiding</title><desc id="desc">Vier stadia scheiden een aangekondigd plan, waargenomen bouw, gebruikte locatie en gekwalificeerde output.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8A5A35"/></marker></defs><rect width="1200" height="760" fill="#F7F5EE"/><text x="70" y="82" fill="#173D2D" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">BEWIJS VOOR UITBREIDING</text><text x="70" y="132" fill="#18201D" font-family="Georgia, serif" font-size="34">Bewijs de mijlpaal die u wilt gebruiken</text>
  <g font-family="Arial, sans-serif"><path d="M310 340H360M570 340H620M830 340H880" stroke="#8A5A35" stroke-width="4" marker-end="url(#arrow)"/>
    <g><rect x="70" y="235" width="240" height="210" rx="18" fill="#173D2D"/><text x="100" y="286" fill="#FFFFFF" font-size="15" font-weight="700">01 · AANGEKONDIGD</text><text x="100" y="337" fill="#FFFFFF" font-size="25" font-weight="700">Plan en schaal</text><text x="100" y="378" fill="#DCE5DC" font-size="15">Bedrijfsuitspraak</text><text x="100" y="407" fill="#DCE5DC" font-size="15">Toekomstige planning</text></g>
    <g><rect x="360" y="235" width="210" height="210" rx="18" fill="#DCE5DC"/><text x="390" y="286" fill="#173D2D" font-size="15" font-weight="700">02 · BOUW</text><text x="390" y="337" fill="#18201D" font-size="23" font-weight="700">Fysiek werk</text><text x="390" y="378" fill="#4C5852" font-size="15">Mijlpaal zichtbaar</text><text x="390" y="407" fill="#4C5852" font-size="15">Geen productie</text></g>
    <g><rect x="620" y="235" width="210" height="210" rx="18" fill="#EEE9BE"/><text x="650" y="286" fill="#173D2D" font-size="15" font-weight="700">03 · IN GEBRUIK</text><text x="650" y="337" fill="#18201D" font-size="23" font-weight="700">Mensen en assets</text><text x="650" y="378" fill="#4C5852" font-size="15">Gebruik te toetsen</text><text x="650" y="407" fill="#4C5852" font-size="15">Output onbekend</text></g>
    <g><rect x="880" y="235" width="250" height="210" rx="18" fill="#173D2D"/><text x="910" y="286" fill="#FFFFFF" font-size="15" font-weight="700">04 · OUTPUT</text><text x="910" y="337" fill="#FFFFFF" font-size="23" font-weight="700">Productspecifiek</text><text x="910" y="378" fill="#DCE5DC" font-size="15">Stabiel, gedateerd bewijs</text><text x="910" y="407" fill="#DCE5DC" font-size="15">Apart bewijs nodig</text></g>
    <rect x="70" y="520" width="1060" height="98" rx="14" fill="#FFFFFF" stroke="#D4CFC2" stroke-width="2"/><text x="100" y="560" fill="#173D2D" font-size="17" font-weight="700">Bewijsgrens</text><text x="100" y="594" fill="#4C5852" font-size="17">Bouw bevestigt voortgang in een bepaald project; het bewijst geen actuele productie-output.</text><text x="70" y="692" fill="#4C5852" font-size="16">Leg bron- en gebeurtenisdatum, reikwijdte en het latere controlepunt voor de volgende stap vast.</text>
  </g>
</svg>
