<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Battery factory scale-up path</title><desc id="desc">Pilot batches, process validation, customer qualification and repeatable commercial supply are separate evidence stages.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8A5A35"/></marker></defs>
  <rect width="1200" height="760" fill="#F7F5EE"/><text x="70" y="82" fill="#173D2D" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">BATTERY SCALE-UP</text><text x="70" y="132" fill="#18201D" font-family="Georgia, serif" font-size="34">From a successful batch to repeatable supply</text>
  <g font-family="Arial, sans-serif"><path d="M300 332H360M560 332H620M820 332H880" stroke="#8A5A35" stroke-width="4" marker-end="url(#arrow)"/>
    <g><rect x="70" y="225" width="230" height="215" rx="18" fill="#173D2D"/><text x="100" y="278" fill="#FFFFFF" font-size="15" font-weight="700">01 · PILOT BATCH</text><text x="100" y="330" fill="#FFFFFF" font-size="24" font-weight="700">Process possible</text><text x="100" y="374" fill="#DCE5DC" font-size="15">Limited conditions</text><text x="100" y="404" fill="#DCE5DC" font-size="15">Small sample</text></g>
    <g><rect x="360" y="225" width="200" height="215" rx="18" fill="#DCE5DC"/><text x="390" y="278" fill="#173D2D" font-size="15" font-weight="700">02 · VALIDATE</text><text x="390" y="330" fill="#18201D" font-size="23" font-weight="700">Stable process</text><text x="390" y="374" fill="#4C5852" font-size="15">Yield · quality · safety</text><text x="390" y="404" fill="#4C5852" font-size="15">Known conditions</text></g>
    <g><rect x="620" y="225" width="200" height="215" rx="18" fill="#EEE9BE"/><text x="650" y="278" fill="#173D2D" font-size="15" font-weight="700">03 · QUALIFY</text><text x="650" y="330" fill="#18201D" font-size="23" font-weight="700">Intended use</text><text x="650" y="374" fill="#4C5852" font-size="15">Chemistry · format</text><text x="650" y="404" fill="#4C5852" font-size="15">Customer criteria</text></g>
    <g><rect x="880" y="225" width="250" height="215" rx="18" fill="#173D2D"/><text x="910" y="278" fill="#FFFFFF" font-size="15" font-weight="700">04 · COMMERCIAL</text><text x="910" y="330" fill="#FFFFFF" font-size="23" font-weight="700">Repeatable supply</text><text x="910" y="374" fill="#DCE5DC" font-size="15">Quality over time</text><text x="910" y="404" fill="#DCE5DC" font-size="15">Sustained deliveries</text></g>
    <rect x="70" y="514" width="1060" height="110" rx="14" fill="#FFFFFF" stroke="#D4CFC2" stroke-width="2"/><text x="100" y="557" fill="#173D2D" font-size="17" font-weight="700">Capacity boundary</text><text x="100" y="593" fill="#4C5852" font-size="17">A GWh design figure does not identify realised yield, qualified products or sustained customer supply.</text><text x="70" y="692" fill="#4C5852" font-size="16">Financing can support a transition, but it does not prove that the technical or commercial transition succeeded.</text>
  </g>
</svg>
