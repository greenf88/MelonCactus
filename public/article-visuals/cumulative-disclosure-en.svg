<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Separate public disclosures can create additional context</title>
  <desc id="desc">A vacancy, supplier case study, trade-fair video and planning record may contribute to a combined context, but each item retains its own provenance, scope, date and uncertainty.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1l9 5-9 5z" fill="#275a45"/></marker></defs>
  <rect width="1200" height="760" fill="#fbfaf6"/>
  <text x="70" y="76" fill="#173d2d" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="4">SEPARATE SIGNALS — RETAIN SEPARATE EVIDENCE LIMITS</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(70 132)"><rect width="280" height="120" fill="#f4f2e9" stroke="#cbcfc6" stroke-width="3"/><text x="24" y="48" fill="#275a45" font-size="21" font-weight="700" letter-spacing="2">RECRUITMENT</text><text x="24" y="91" fill="#18201d" font-family="Georgia,serif" font-size="31" font-weight="600">Vacancy</text></g>
    <g transform="translate(70 278)"><rect width="280" height="120" fill="#f4f2e9" stroke="#cbcfc6" stroke-width="3"/><text x="24" y="48" fill="#275a45" font-size="21" font-weight="700" letter-spacing="2">SUPPLIER</text><text x="24" y="91" fill="#18201d" font-family="Georgia,serif" font-size="31" font-weight="600">Case study</text></g>
    <g transform="translate(70 424)"><rect width="280" height="120" fill="#f4f2e9" stroke="#cbcfc6" stroke-width="3"/><text x="24" y="48" fill="#275a45" font-size="21" font-weight="700" letter-spacing="2">EVENT</text><text x="24" y="91" fill="#18201d" font-family="Georgia,serif" font-size="31" font-weight="600">Trade-fair video</text></g>
    <g transform="translate(70 570)"><rect width="280" height="120" fill="#f4f2e9" stroke="#cbcfc6" stroke-width="3"/><text x="24" y="48" fill="#275a45" font-size="21" font-weight="700" letter-spacing="2">PUBLIC RECORD</text><text x="24" y="91" fill="#18201d" font-family="Georgia,serif" font-size="31" font-weight="600">Planning record</text></g>
  </g>
  <g fill="none" stroke="#275a45" stroke-width="5" marker-end="url(#arrow)"><path d="M370 192C505 192 485 312 582 333"/><path d="M370 338h196"/><path d="M370 484c135 0 115-105 212-126"/><path d="M370 630c175 0 200-190 212-246"/></g>
  <g transform="translate(600 240)">
    <rect width="530" height="300" fill="#173d2d"/>
    <text x="35" y="55" fill="#d8c95d" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="3">COMBINED CONTEXT</text>
    <text x="35" y="120" fill="#fff" font-family="Georgia,serif" font-size="41" font-weight="600"><tspan x="35">A pattern may become</tspan><tspan x="35" dy="50">more informative</tspan></text>
    <line x1="35" y1="205" x2="495" y2="205" stroke="#d8c95d" stroke-width="3"/>
    <text x="35" y="247" fill="#dce5dc" font-family="Arial,Helvetica,sans-serif" font-size="23">Only when source relationships, timing</text>
    <text x="35" y="278" fill="#dce5dc" font-family="Arial,Helvetica,sans-serif" font-size="23">and contradictions remain visible.</text>
  </g>
  <rect x="600" y="570" width="530" height="120" fill="#eee9be"/>
  <text x="630" y="615" fill="#8f4938" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="2">EVIDENCE BOUNDARY</text>
  <text x="630" y="650" fill="#18201d" font-family="Georgia,serif" font-size="26" font-weight="600"><tspan x="630">Context is not proof of hidden</tspan><tspan x="630" dy="31">capacity or intent.</tspan></text>
</svg>
