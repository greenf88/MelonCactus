<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1100" viewBox="0 0 760 1100" role="img" aria-labelledby="title desc">
  <title id="title">Opschalingspad voor een batterijfabriek</title><desc id="desc">Een verticaal pad loopt van proefserie via validatie en kwalificatie naar commerciële levering.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8A5A35"/></marker></defs>
  <rect width="760" height="1100" fill="#F7F5EE"/><text x="52" y="70" fill="#173D2D" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">BATTERIJOPSCHALING</text><text x="52" y="114" fill="#18201D" font-family="Georgia, serif" font-size="27">Een serie is geen commerciële schaal</text>
  <g font-family="Arial, sans-serif"><path d="M380 278V305M380 473V500M380 668V695" stroke="#8A5A35" stroke-width="4" marker-end="url(#arrow)"/>
    <g><rect x="52" y="150" width="656" height="128" rx="16" fill="#173D2D"/><text x="82" y="195" fill="#FFFFFF" font-size="15" font-weight="700">01 · PROEFSERIE</text><text x="82" y="238" fill="#FFFFFF" font-size="23" font-weight="700">Proces mogelijk onder beperkte condities</text></g>
    <g><rect x="52" y="305" width="656" height="168" rx="16" fill="#DCE5DC"/><text x="82" y="352" fill="#173D2D" font-size="15" font-weight="700">02 · PROCESVALIDATIE</text><text x="82" y="396" fill="#18201D" font-size="23" font-weight="700">Toets opbrengst, kwaliteit en veiligheid</text><text x="82" y="435" fill="#4C5852" font-size="15">Condities en uitzonderingen moeten bekend zijn.</text></g>
    <g><rect x="52" y="500" width="656" height="168" rx="16" fill="#EEE9BE"/><text x="82" y="547" fill="#173D2D" font-size="15" font-weight="700">03 · KLANTKWALIFICATIE</text><text x="82" y="591" fill="#18201D" font-size="23" font-weight="700">Geschiktheid voor beoogd gebruik aantonen</text><text x="82" y="630" fill="#4C5852" font-size="15">Chemie, formaat en criteria tellen mee.</text></g>
    <g><rect x="52" y="695" width="656" height="168" rx="16" fill="#173D2D"/><text x="82" y="742" fill="#FFFFFF" font-size="15" font-weight="700">04 · COMMERCIËLE LEVERING</text><text x="82" y="786" fill="#FFFFFF" font-size="23" font-weight="700">Herhaalbare kwaliteit en leveringen</text><text x="82" y="825" fill="#DCE5DC" font-size="15">Duurzaam bewijs over tijd is nodig.</text></g>
    <rect x="52" y="915" width="656" height="118" rx="14" fill="#FFFFFF" stroke="#D4CFC2" stroke-width="2"/><text x="82" y="959" fill="#173D2D" font-size="17" font-weight="700">Capaciteitsgrens</text><text x="82" y="995" fill="#4C5852" font-size="15">Ontwerp-GWh is geen opbrengst of levering.</text>
  </g>
</svg>
