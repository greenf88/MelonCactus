<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bewijsstadia in een capaciteitsprognose</title><desc id="desc">Een genoemde basislijn, geplande uitbreiding, onderzochte mogelijkheid en gerealiseerde output zijn verschillende bewijsstadia.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8A5A35"/></marker></defs>
  <rect width="1200" height="760" fill="#F7F5EE"/><text x="70" y="82" fill="#173D2D" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">CAPACITEITSPROGNOSE LEZEN</text><text x="70" y="132" fill="#18201D" font-family="Georgia, serif" font-size="34">Het werkwoord bepaalt het bewijsstadium</text>
  <g font-family="Arial, sans-serif"><path d="M310 340H360M570 340H620M830 340H880" stroke="#8A5A35" stroke-width="4" marker-end="url(#arrow)"/>
    <g><rect x="70" y="225" width="240" height="220" rx="18" fill="#173D2D"/><text x="100" y="278" fill="#FFFFFF" font-size="15" font-weight="700">01 · BASISLIJN</text><text x="100" y="330" fill="#FFFFFF" font-size="24" font-weight="700">Referentiepunt</text><text x="100" y="374" fill="#DCE5DC" font-size="15">Toegeschreven cijfer</text><text x="100" y="404" fill="#DCE5DC" font-size="15">Reikwijdte en datum</text></g>
    <g><rect x="360" y="225" width="210" height="220" rx="18" fill="#DCE5DC"/><text x="390" y="278" fill="#173D2D" font-size="15" font-weight="700">02 · GEPLAND</text><text x="390" y="330" fill="#18201D" font-size="23" font-weight="700">Beoogde uitbreiding</text><text x="390" y="374" fill="#4C5852" font-size="15">Uitvoering is nodig</text><text x="390" y="404" fill="#4C5852" font-size="15">Afhankelijkheden blijven</text></g>
    <g><rect x="620" y="225" width="210" height="220" rx="18" fill="#EEE9BE"/><text x="650" y="278" fill="#173D2D" font-size="15" font-weight="700">03 · ONDERZOCHT</text><text x="650" y="330" fill="#18201D" font-size="23" font-weight="700">Mogelijke optie</text><text x="650" y="374" fill="#4C5852" font-size="15">Geen toezegging</text><text x="650" y="404" fill="#4C5852" font-size="15">Voorwaarden open</text></g>
    <g><rect x="880" y="225" width="250" height="220" rx="18" fill="#173D2D"/><text x="910" y="278" fill="#FFFFFF" font-size="15" font-weight="700">04 · GEREALISEERD</text><text x="910" y="330" fill="#FFFFFF" font-size="23" font-weight="700">Gemeten output</text><text x="910" y="374" fill="#DCE5DC" font-size="15">Product en periode</text><text x="910" y="404" fill="#DCE5DC" font-size="15">Later bewijs nodig</text></g>
    <rect x="70" y="520" width="1060" height="104" rx="14" fill="#FFFFFF" stroke="#D4CFC2" stroke-width="2"/><text x="100" y="561" fill="#173D2D" font-size="17" font-weight="700">Voeg de reeksen niet samen</text><text x="100" y="597" fill="#4C5852" font-size="17">Capaciteit, orders, productie en leveringen kunnen verwante cijfers gebruiken maar andere vragen beantwoorden.</text><text x="70" y="692" fill="#4C5852" font-size="16">Volg de oorspronkelijke uitspraak, voorwaarden en de latere waarneming die realisatie kan toetsen.</text>
  </g>
</svg>
