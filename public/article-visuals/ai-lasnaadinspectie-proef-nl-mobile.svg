  <path d="m368 840 12 14 12-14" fill="none" stroke="#8FAE9B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="48" y="872" width="664" height="124" rx="24" fill="#EEE9BE"/>
  <circle cx="94" cy="916" r="22" fill="#173D2D"/>
  <text x="94" y="924" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">4</text>
  <text x="132" y="916" fill="#173D2D" font-family="Arial, sans-serif" font-size="21" font-weight="700">Vakmens bepaalt het vervolg</text>
