<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Van zoekvraag naar een controleerbare uitkomst</title>
  <desc id="desc">Controleer toegang en de geldige bronpassage. Schakel een specialist in bij tegenstrijdige of ontbrekende bronnen.</desc>
  <rect width="1200" height="760" rx="32" fill="#F7F6EE"/>
  <g font-family="Arial, sans-serif" fill="#173D2D">
    <text x="76" y="138" font-size="45" font-weight="700">Kan de medewerker dit antwoord gebruiken?</text>
    <path d="M391 354h41m-12-10 12 10-12 10m345-10h41m-12-10 12 10-12 10" fill="none" stroke="#557C66" stroke-width="4"/>
    <rect x="76" y="204" width="300" height="300" rx="24" fill="#173D2D"/>
    <text x="104" y="273" font-size="32" font-weight="700" fill="#FFFFFF">Toegang</text>
    <text x="104" y="337" font-size="27" fill="#EEE9BE">Mag de rol het</text>
    <text x="104" y="375" font-size="27" fill="#EEE9BE">document openen?</text>
    <rect x="450" y="204" width="300" height="300" rx="24" fill="#FFFFFF" stroke="#DCE5DC" stroke-width="3"/>
    <text x="478" y="273" font-size="32" font-weight="700">Geldige bron</text>
    <text x="478" y="337" font-size="27" fill="#4C5852">Welke versie en</text>
    <text x="478" y="375" font-size="27" fill="#4C5852">welke passage?</text>
    <rect x="824" y="204" width="300" height="300" rx="24" fill="#FFFFFF" stroke="#DCE5DC" stroke-width="3"/>
    <text x="852" y="273" font-size="32" font-weight="700">Uitkomst</text>
    <text x="852" y="337" font-size="27" fill="#4C5852">Antwoord of naar</text>
    <text x="852" y="375" font-size="27" fill="#4C5852">een specialist.</text>
    <rect x="76" y="558" width="1048" height="100" rx="24" fill="#EEE9BE"/>
    <text x="106" y="620" font-size="28" font-weight="700">Ontbrekende bron of conflict? Laat een specialist beoordelen.</text>
  </g>
</svg>
