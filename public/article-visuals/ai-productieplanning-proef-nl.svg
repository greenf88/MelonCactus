  <text x="826" y="590" fill="#18201D" font-family="Arial, sans-serif" font-size="18" font-weight="700">en beslist</text>

  <text x="70" y="674" fill="#173D2D" font-family="Arial, sans-serif" font-size="20" font-weight="700">Proefgrens</text>
