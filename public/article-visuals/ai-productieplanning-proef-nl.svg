  <path d="m370 282 14 12-14 12" fill="none" stroke="#8FAE9B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 472h52" stroke="#8FAE9B" stroke-width="5" stroke-linecap="round"/>
