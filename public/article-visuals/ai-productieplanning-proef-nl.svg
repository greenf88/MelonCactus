<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Eén orderpakket, twee planningen, dezelfde meetlat</title>
  <desc id="desc">Hetzelfde historische orderpakket gaat naar een vaste planningsregel en een AI-voorstel. Beide worden vergeleken op late orders, wachttijd, correcties en uitvoerbaarheid voordat een planner beslist.</desc>
  <rect width="1200" height="760" rx="36" fill="#F7F6EE"/>
  <text x="70" y="72" fill="#173D2D" font-family="Arial, sans-serif" font-size="32" font-weight="700">Eén orderpakket, twee planningen</text>
  <text x="70" y="110" fill="#4C5852" font-family="Arial, sans-serif" font-size="19">Gebruik dezelfde informatie en dezelfde meetlat.</text>

  <rect x="70" y="170" width="240" height="420" rx="28" fill="#173D2D"/>
  <text x="98" y="216" fill="#EEE9BE" font-family="Arial, sans-serif" font-size="17" font-weight="700">GELIJKE INVOER</text>
  <text x="98" y="264" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="25" font-weight="700">Historische orders</text>
  <text x="98" y="312" fill="#DCE5DC" font-family="Arial, sans-serif" font-size="18">Materiaalstatus</text>
  <text x="98" y="346" fill="#DCE5DC" font-family="Arial, sans-serif" font-size="18">Bewerkingstijd</text>
  <text x="98" y="380" fill="#DCE5DC" font-family="Arial, sans-serif" font-size="18">Beloofde datum</text>
  <text x="98" y="414" fill="#DCE5DC" font-family="Arial, sans-serif" font-size="18">Machinebeschikbaarheid</text>
  <line x1="98" y1="454" x2="282" y2="454" stroke="#8FAE9B" stroke-width="2"/>
  <text x="98" y="496" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">Alleen wat toen</text>
  <text x="98" y="526" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">bekend was</text>

