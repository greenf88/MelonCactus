<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1100" viewBox="0 0 760 1100" role="img" aria-labelledby="title desc">
  <title id="title">Separate public signals can add context when combined</title>
  <desc id="desc">Four ordinary public signals lead to a combined context panel, followed by an evidence boundary that preserves uncertainty.</desc>
  <rect width="760" height="1100" rx="32" fill="#F4F2E9"/>
  <text x="50" y="67" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">SEPARATE PUBLIC SIGNALS</text>

  <rect x="50" y="105" width="315" height="150" rx="22" fill="#FFFFFF" stroke="#CDD5CE" stroke-width="2"/>
  <circle cx="92" cy="147" r="18" fill="#EEE9BE"/>
  <text x="92" y="154" text-anchor="middle" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">1</text>
  <text x="124" y="145" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Vacancy</text>
  <text x="82" y="191" fill="#4C5852" font-family="Arial, Helvetica, sans-serif" font-size="20">Skills, location and</text>
  <text x="82" y="220" fill="#4C5852" font-family="Arial, Helvetica, sans-serif" font-size="20">timing clues</text>

  <rect x="395" y="105" width="315" height="150" rx="22" fill="#FFFFFF" stroke="#CDD5CE" stroke-width="2"/>
  <circle cx="437" cy="147" r="18" fill="#EEE9BE"/>
  <text x="437" y="154" text-anchor="middle" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">2</text>
  <text x="469" y="145" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Supplier case</text>
  <text x="427" y="191" fill="#4C5852" font-family="Arial, Helvetica, sans-serif" font-size="20">Equipment and</text>
  <text x="427" y="220" fill="#4C5852" font-family="Arial, Helvetica, sans-serif" font-size="20">relationship clues</text>

  <rect x="50" y="285" width="315" height="150" rx="22" fill="#FFFFFF" stroke="#CDD5CE" stroke-width="2"/>
  <circle cx="92" cy="327" r="18" fill="#EEE9BE"/>
  <text x="92" y="334" text-anchor="middle" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">3</text>
  <text x="124" y="325" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Trade-fair video</text>
  <text x="82" y="371" fill="#4C5852" font-family="Arial, Helvetica, sans-serif" font-size="20">Sequence and layout</text>
  <text x="82" y="400" fill="#4C5852" font-family="Arial, Helvetica, sans-serif" font-size="20">clues</text>

  <rect x="395" y="285" width="315" height="150" rx="22" fill="#FFFFFF" stroke="#CDD5CE" stroke-width="2"/>
  <circle cx="437" cy="327" r="18" fill="#EEE9BE"/>
  <text x="437" y="334" text-anchor="middle" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">4</text>
  <text x="469" y="325" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Planning record</text>
  <text x="427" y="371" fill="#4C5852" font-family="Arial, Helvetica, sans-serif" font-size="20">Capacity and site</text>
  <text x="427" y="400" fill="#4C5852" font-family="Arial, Helvetica, sans-serif" font-size="20">change clues</text>

  <path d="M207 445v47M552 445v47" stroke="#789184" stroke-width="5"/>
  <path d="M207 492h345" stroke="#789184" stroke-width="5"/>
  <path d="M380 492v43" stroke="#789184" stroke-width="5"/>
  <path d="m366 525 14 14 14-14" fill="none" stroke="#789184" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="50" y="555" width="660" height="270" rx="26" fill="#173D2D"/>
  <text x="82" y="609" fill="#EEE9BE" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">COMBINED CONTEXT</text>
  <text x="82" y="668" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Together, the signals can</text>
  <text x="82" y="710" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">support a more useful question.</text>
  <text x="82" y="762" fill="#DCE5DC" font-family="Arial, Helvetica, sans-serif" font-size="22">Correlation adds context, but does not</text>
  <text x="82" y="793" fill="#DCE5DC" font-family="Arial, Helvetica, sans-serif" font-size="22">turn an explanation into a fact.</text>

  <rect x="50" y="855" width="660" height="180" rx="24" fill="#EEE9BE"/>
  <text x="82" y="908" fill="#18201D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">EVIDENCE BOUNDARY</text>
  <text x="82" y="953" fill="#18201D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Source dates, alternatives and unknowns</text>
  <text x="82" y="986" fill="#18201D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">remain explicit.</text>
  <text x="82" y="1021" fill="#3F443F" font-family="Arial, Helvetica, sans-serif" font-size="20">No single signal proves the combined explanation.</text>
</svg>
