  <rect x="70" y="548" width="1060" height="114" rx="24" fill="#EEE9BE"/>
  <text x="100" y="590" fill="#173D2D" font-family="Arial, sans-serif" font-size="18" font-weight="700">PROEFGRENS</text>
  <text x="100" y="626" fill="#18201D" font-family="Arial, sans-serif" font-size="19">Geen automatische vrijgave · geen vervanging van voorgeschreven inspectie · geen resultaat vooraf aannemen</text>
  <text x="70" y="714" fill="#4C5852" font-family="Arial, sans-serif" font-size="17">Een bruikbaar modelresultaat blijft een intern signaal totdat een bevoegde vakbeoordelaar het kwaliteitsvervolg bepaalt.</text>
