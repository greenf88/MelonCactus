  <text x="98" y="348" fill="#DCE5DC" font-family="Arial, sans-serif" font-size="18">Hoek en verlichting</text>
  <text x="98" y="384" fill="#DCE5DC" font-family="Arial, sans-serif" font-size="18">Scherpte en dekking</text>
