<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Eén lasnaadtype, één fotoprotocol, één vaste meetlat</title>
  <desc id="desc">Een afgebakende proef leidt vaste lasnaadfoto's via vaklabels en een gesloten testset naar foutentelling en een menselijke kwaliteitsbeslissing.</desc>
  <rect width="1200" height="760" rx="36" fill="#F7F6EE"/>
  <text x="70" y="72" fill="#173D2D" font-family="Arial, sans-serif" font-size="32" font-weight="700">AI-lasnaadinspectie als afgebakende proef</text>
  <text x="70" y="110" fill="#4C5852" font-family="Arial, sans-serif" font-size="19">Zelfde lasnaad · vaste beelden · gesloten testset · vakmens beslist</text>

  <rect x="70" y="170" width="230" height="320" rx="26" fill="#173D2D"/>
  <circle cx="112" cy="214" r="22" fill="#EEE9BE"/>
