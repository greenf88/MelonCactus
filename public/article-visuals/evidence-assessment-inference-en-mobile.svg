<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1100" viewBox="0 0 760 1100" role="img" aria-labelledby="title desc">
  <title id="title">Evidence, assessment and inference are different analytical categories</title>
  <desc id="desc">Three stacked panels distinguish directly supported evidence, reasoned assessment and a plausible but unproven inference.</desc>
  <rect width="760" height="1100" rx="32" fill="#F4F2E9"/>
  <text x="50" y="67" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">THREE ANALYTICAL CATEGORIES</text>

  <rect x="50" y="105" width="660" height="245" rx="24" fill="#173D2D"/>
  <rect x="82" y="137" width="132" height="40" rx="20" fill="#EEE9BE"/>
  <text x="148" y="164" text-anchor="middle" fill="#18201D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">DIRECT</text>
  <text x="82" y="222" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Evidence</text>
  <text x="82" y="263" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="25">Directly supported</text>
  <text x="82" y="307" fill="#DCE5DC" font-family="Arial, Helvetica, sans-serif" font-size="22">Traceable statement or observation;</text>
  <text x="82" y="336" fill="#DCE5DC" font-family="Arial, Helvetica, sans-serif" font-size="22">provenance retained.</text>

  <path d="M380 350v42" stroke="#789184" stroke-width="5"/>
  <path d="m366 382 14 14 14-14" fill="none" stroke="#789184" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="50" y="405" width="660" height="245" rx="24" fill="#DCE5DC" stroke="#8AA095" stroke-width="2"/>
  <rect x="82" y="437" width="168" height="40" rx="20" fill="#173D2D"/>
  <text x="166" y="464" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">REASONED</text>
  <text x="82" y="522" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Assessment</text>
  <text x="82" y="563" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="25">Reasoned judgement</text>
  <text x="82" y="607" fill="#374B42" font-family="Arial, Helvetica, sans-serif" font-size="22">Weighs sources; states contradiction</text>
  <text x="82" y="636" fill="#374B42" font-family="Arial, Helvetica, sans-serif" font-size="22">and uncertainty.</text>

  <path d="M380 650v42" stroke="#789184" stroke-width="5"/>
  <path d="m366 682 14 14 14-14" fill="none" stroke="#789184" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="50" y="705" width="660" height="245" rx="24" fill="#EEE9BE" stroke="#C9C28A" stroke-width="2"/>
  <rect x="82" y="737" width="158" height="40" rx="20" fill="#18201D"/>
  <text x="161" y="764" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">UNPROVEN</text>
  <text x="82" y="822" fill="#18201D" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Inference</text>
  <text x="82" y="863" fill="#18201D" font-family="Arial, Helvetica, sans-serif" font-size="25">Plausible explanation</text>
  <text x="82" y="907" fill="#3F443F" font-family="Arial, Helvetica, sans-serif" font-size="22">Not directly established;</text>
  <text x="82" y="936" fill="#3F443F" font-family="Arial, Helvetica, sans-serif" font-size="22">alternatives remain visible.</text>

  <rect x="50" y="985" width="660" height="70" rx="20" fill="#FFFFFF" stroke="#CDD5CE" stroke-width="2"/>
  <text x="380" y="1018" text-anchor="middle" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Clear labels prevent certainty from</text>
  <text x="380" y="1045" text-anchor="middle" fill="#173D2D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">being overstated.</text>
</svg>
